name: Synapsor
description: Synapsor (legal entity Ottai Technology (Wuxi) Co. Ltd.) is a Chinese
  medical-device company based in Wuxi, Jiangsu that develops AI-powered, medical-grade
  smart wearable devices. Its flagship product is the Ottai continuous glucose monitoring
  (CGM) system - a waterproof, calibration-free wearable sensor paired with a mobile
  app and AI assistant for 24/7 glucose tracking and diabetes management, sold in China
  and internationally via ottai.com. Investors include Qiming Venture Partners, Huatai
  Zijin Investment, Wuxi Industry Development Group, YuanBio Venture Capital, and
  Shunwei Capital. Synapsor publishes no public developer API, portal, or machine-readable
  API specifications as of July 2026.
